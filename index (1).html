rugby:{k:'logs',own:x=>x.type==='Rugby',add:{type:'Rugby'},title:'Log a session',f:[['date','date','Date'],['focus','sel:Passing,Kicking,Decision making,Conditioning,Match,Skills circuit,Recovery,Other','Focus'],['mins','num','Minutes'],['intensity','sel:Medium,Light,Hard','Intensity'],['notes','area','Notes']],t:x=>x.focus,s:x=>[pd(x.date),x.mins?x.mins+' min':'',x.intensity,x.notes]},

life:{k:'logs',own:x=>!['Rugby','Focus','Study'].includes(x.type),title:'Quick log',f:[['type','sel:Meal / nutrition,Sleep,Recovery,Mobility,Life admin,Other','Type'],['date','date','Date'],['mins','num','Minutes'],['notes','area','Notes']],t:x=>x.type,s:x=>[pd(x.date),x.mins?x.mins+' min':'',x.notes]},
focus:{k:'logs',own:x=>x.type==='Focus',noform:1,f:[],t:x=>x.label||x.notes||'Focus block',s:x=>[pd(x.date),x.mins+' min']},
task:{k:'tasks',title:'Add a task',f:[['title','text','Task'],['priority','sel:Medium,High,Low','Priority'],['due','date','Due'],['notes','text','Notes']],def:{status:'Open'},t:x=>x.title,s:x=>[x.priority,x.due?(x.status!=='Done'&&x.due<dk()?'Overdue ':'')+pd(x.due):'',x.notes],act:x=>x.status==='Done'?'Reopen':'Done',tog:x=>({status:x.status==='Done'?'Open':'Done'}),dim:x=>x.status==='Done',sort:(a,b)=>(a.status==='Done')-(b.status==='Done')||dd(a,b)},

const ed={};

$('#score').textContent=p+'%';$('#bar').style.width=p+'%';$('#hint').textContent=p===100?'All standards done.':p>=60?'Solid. Keep going.':'Start with one useful action.';$('#hc').textContent=c+' / 8';

$('#next').innerHTML=n.length?n.map(([a,d,k])=>`<div class="row bw ln"><span>${esc(a)} <small style="display:inline">${k}</small></span><small class="${d&&d<t?'od':''}">${d?(d<t?'Overdue, ':'')+pd(d):'No date'}</small></div>`).join(''):'<div class="mu">Nothing due. Pick a standard and go.</div>';
bars();const e=read('last-export',0),has=L.length+read('journal',[]).length+TK.length>0,nd=$('#nudge');nd.hidden=!(has&&Date.now()-e>6048e5);nd.innerHTML='Your data only lives on this device. <a class="btn" href="#progress">Back it up</a>'}
function drawToday(){const t=dk();$('#dt').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});chk($('#habits'),HAB,'checks-'+t);chk($('#gm'),GM,'glow-'+t);chk($('#ge'),GE,'glow-'+t);chk($('#gw'),GW,'glow-week-'+off(-new Date().getDay()));const r=read('review-'+t,{}),w=read('weekly',{});$$('[data-rv]').forEach(e=>e.value=r[e.dataset.rv]||'');$$('[data-wk]').forEach(e=>e.value=w[e.dataset.wk]||'')}

/* Learn: units and skill paths */
const gu=()=>read('units',null)||SEM.map(n=>({name:n,progress:0,topic:'',next:''}));
function units(){const nt=read('unit-notes',{});$('#units').innerHTML=gu().map((x,i)=>`<div class="panel"><div class="row bw"><b>${esc(x.name)}</b><span class="row"><span class="mu">${x.progress||0}%</span><button class="dg" data-a="udel" data-i="${i}">Remove</button></span></div><div class="bar"><i style="width:${x.progress||0}%"></i></div><div class="g"><label class="f">Progress %<input type="number" min="0" max="100" value="${x.progress||0}" data-u="${i}" data-n="progress"></label><label class="f">Current topic<input value="${esc(x.topic)}" data-u="${i}" data-n="topic"></label><label class="f">Next action<input value="${esc(x.next)}" data-u="${i}" data-n="next"></label></div><label class="f">Notes<textarea data-un="${esc(x.name)}">${esc(nt[x.name]||'')}</textarea></label></div>`).join('')+'<button data-a="uadd">Add unit</button>'}
function skills(){const s=read('skill-progress',{});$('#sk').innerHTML=SK.map(([id,n,st,u])=>{const a=new Set(s[id]||[]);return`<details class="panel"><summary>${n} <span class="mu">${Math.round(a.size/st.length*100)}%</span></summary>${st.map((x,i)=>`<label class="chk"><input type="checkbox" data-sk="${id}" data-i="${i}"${a.has(i)?' checked':''}><span>${x}</span></label>`).join('')}<a class="btn" href="${u}" target="_blank" rel="noopener" style="margin-top:8px">Open resource</a></details>`}).join('')}

/* Focus timer: timestamp based, survives refresh and background throttling */
let T={mins:25,end:0,rem:0,label:'',...read('timer',{})};
const left=()=>T.end?Math.max(0,Math.round((T.end-Date.now())/1e3)):(T.rem||T.mins*60),tsave=()=>write('timer',T);
function tdraw(){const s=left(),t=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;$('#td').textContent=t;document.title=T.end?t+' ZAYO LN':'ZAYO LN';$('#tb').textContent=T.end?'Pause':T.rem?'Resume':'Start';$$('.pre button').forEach(b=>b.classList.toggle('on',+b.dataset.m===T.mins));if(T.end&&s<=0)tdone()}
function tgo(){if(T.end){T.rem=left();T.end=0}else{T.end=Date.now()+left()*1e3;T.rem=0;try{Notification.requestPermission()}catch{}}tsave();tdraw()}
function tdone(){const a=read('logs',[]);a.unshift({id:uid(),type:'Focus',date:dk(),mins:T.mins,notes:T.label||T.mins+' min focus',label:T.label});write('logs',a);T.end=0;T.rem=0;tsave();try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.4)}catch{}toast('Focus block complete: '+T.mins+' min');try{if(Notification.permission==='granted')new Notification('ZAYO LN',{body:'Focus block complete'})}catch{}renderCol('focus');refresh();tdraw()}

/* Discover */
let topic='all';
function disc(){const sv=new Set(read('media-saved',[]));$('#dc').innerHTML=[['ke','Kenyan Hip-Hop'],['us','US Hip-Hop'],['rg','Rugby']].filter(([k])=>topic==='all'||topic==='saved'||topic===k).map(([k,n])=>{const l=CUR[k].filter(x=>topic!=='saved'||sv.has(x[0]));return l.length?`<h4>${n}</h4><div class="cards">${l.map(x=>`<button class="card" data-a="card" data-i="${x[0]}"><b>${esc(x[1])}</b><small>${esc(x[2])}</small>${sv.has(x[0])?'<span class="st" aria-label="Saved">★</span>':''}</button>`).join('')}</div>`:''}).join('')||'<div class="empty">Nothing saved yet. Open a card and tap Save.</div>'}
function card(i){const x=Object.values(CUR).flat().find(y=>y[0]===i);if(!x)return;const sv=read('media-saved',[]).includes(i),rg=i[0]==='r',q=encodeURIComponent(x[1]+(rg?' rugby':' music'));
$('#dlg').innerHTML=`<h3>${esc(x[1])}</h3><small>${esc(x[2])}</small><p style="margin:10px 0">${esc(x[3])}</p><div class="row"><a class="btn" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTube</a>${rg?'':`<a class="btn" href="https://open.spotify.com/search/${encodeURIComponent(x[1])}" target="_blank" rel="noopener">Spotify</a>`}</div><label class="f" style="margin-top:12px">Your notes<textarea id="mn">${esc(read('media-notes',{})[i]||'')}</textarea></label><div class="row" style="margin-top:12px"><button class="pri" data-a="nsave" data-i="${i}">Save note</button><button data-a="msave" data-i="${i}">${sv?'Unsave':'Save to favourites'}</button><button onclick="this.closest('dialog').close()">Close</button></div>`;$('#dlg').showModal()}

/* Progress and backup */
function drawProg(){const L=read('logs',[]);let m=0;for(let i=0;i<31;i++)if(cnt(off(-i)))m++;const ty={};L.forEach(l=>{const o=ty[l.type]=ty[l.type]||[0,0];o[0]++;o[1]+=+l.mins||0});
$('#pst').innerHTML=[['Streak',streak()+' days'],['Active days, last 31',m],['Total logs',L.length]].map(([k,v])=>`<div><small>${k}</small><b>${v}</b></div>`).join('');
$('#hm').innerHTML=[...Array(28)].map((_,i)=>{const k=off(i-27),n=cnt(k);return`<div style="--l:${n/8}" title="${k}: ${n}/8">${+k.slice(8)}</div>`}).join('');
$('#bk').innerHTML=Object.entries(ty).map(([k,[n,mn]])=>`<div class="row bw ln"><span>${esc(k)}</span><span class="mu">${n} logs, ${mn} min</span></div>`).join('')||'<div class="mu">No logs yet.</div>';bars();
const e=read('last-export',0);$('#ex').textContent=e?'Last backup: '+new Date(e).toLocaleString():'No backup yet.'}
function exp(){const d={};try{for(const k of Object.keys(localStorage))if(k.startsWith(P))d[k]=localStorage.getItem(k)}catch{}mem.forEach((v,k)=>d[k]=v);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:5,exported:new Date().toISOString(),data:d})],{type:'application/json'}));a.download='zayo-ln-backup-'+dk()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3);write('last-export',Date.now());toast('Backup downloaded');drawProg();refresh()}
async function imp(f){if(!f)return;try{const j=JSON.parse(await f.text()),e=Object.entries(j.data||j).filter(([k,v])=>k.startsWith(P)&&typeof v==='string');if(!e.length)throw 0;if(!confirm(`Import ${e.length} items? This overwrites matching data on this device. Export first if unsure.`))return;e.forEach(([k,v])=>{try{JSON.parse(v);localStorage.setItem(k,v)}catch{}});location.reload()}catch{toast('That is not a valid ZAYO backup file')}}

/* Events */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const{a,c,i}=b.dataset,k=c&&COLS[c]?.k;
if(a==='del'){const old=read(k,[]);write(k,old.filter(x=>String(x.id)!==i));renderCol(c);refresh();toast('Deleted',()=>{write(k,old);renderCol(c);refresh()})}
else if(a==='edit'){ed[c]=i;renderForm(c);$('#f-'+c).scrollIntoView({block:'nearest'})}
else if(a==='cancel'){ed[c]=null;renderForm(c)}
else if(a==='act'){write(k,read(k,[]).map(x=>String(x.id)===i?{...x,...COLS[c].tog(x)}:x));renderCol(c);refresh()}
else if(a==='topic'){topic=i;$$('[data-a=topic]').forEach(x=>x.classList.toggle('on',x.dataset.i===i));disc()}
else if(a==='card')card(i);
else if(a==='nsave'){const n=read('media-notes',{});n[i]=$('#mn').value;write('media-notes',n);$('#dlg').close();toast('Note saved')}
else if(a==='msave'){let s=read('media-saved',[]);s=s.includes(i)?s.filter(x=>x!==i):[...s,i];write('media-saved',s);$('#dlg').close();disc();toast(s.includes(i)?'Saved to favourites':'Removed from favourites')}
else if(a==='uadd'){const n=prompt('Unit name');if(n&&n.trim()){const u=gu();u.push({name:n.trim(),progress:0,topic:'',next:''});write('units',u);units()}}
else if(a==='udel'){const u=gu();if(!confirm('Remove "'+u[i].name+'"?'))return;u.splice(i,1);write('units',u);units()}
else if(a==='exp')exp();else if(a==='tgo')tgo();
else if(a==='treset'){T.end=0;T.rem=0;tsave();tdraw()}
else if(a==='tpre'){if(T.end)return toast('Pause or reset first');T.mins=+i;T.rem=0;tsave();tdraw()}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-c]');if(!f)return;e.preventDefault();const id=f.dataset.c,c=COLS[id],d=Object.fromEntries(new FormData(f));
for(const[n,t]of c.f){if(typeof d[n]==='string')d[n]=d[n].trim();if(t==='num'&&d[n]!=='')d[n]=Number(d[n])}
const rq=c.req||(c.f[0][1]==='text'?c.f[0][0]:null);if(rq&&!String(d[rq]??'').trim())return toast('Fill in the '+c.f.find(x=>x[0]===rq)[2].toLowerCase());
if(id==='money'&&!(d.amount>0))return toast('Enter an amount above zero');
const a=read(c.k,[]);if(ed[id]){write(c.k,a.map(x=>String(x.id)===String(ed[id])?{...x,...d}:x));ed[id]=null;toast('Changes saved')}else{a.unshift({id:uid(),...(c.def||{}),...(c.add||{}),date:dk(),...d});write(c.k,a);toast('Added')}
renderForm(id);renderCol(id);refresh()});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(d.rv){const k='review-'+dk(),r=read(k,{});r[d.rv]=t.value;write(k,r);toast('Review saved')}
else if(d.wk){const w=read('weekly',{});w[d.wk]=t.value;write('weekly',w)}
else if(d.u!==undefined){const u=gu();u[d.u][d.n]=d.n==='progress'?Math.min(100,Math.max(0,+t.value||0)):t.value;write('units',u);if(d.n==='progress'){const p=t.closest('.panel');p.querySelector('.mu').textContent=u[d.u].progress+'%';p.querySelector('.bar i').style.width=u[d.u].progress+'%'}}
else if(d.un){const n=read('unit-notes',{});n[d.un]=t.value;write('unit-notes',n)}
else if(d.sk){const s=read('skill-progress',{}),a=new Set(s[d.sk]||[]);t.checked?a.add(+d.i):a.delete(+d.i);s[d.sk]=[...a];write('skill-progress',s);t.closest('details').querySelector('summary span').textContent=Math.round(a.size/SK.find(x=>x[0]===d.sk)[2].length*100)+'%'}
else if(t.id==='imp'){imp(t.files[0]);t.value=''}});
document.addEventListener('input',e=>{const t=e.target;if(t.id?.startsWith('q-'))renderCol(t.id.slice(2));else if(t.id==='tl'){T.label=t.value;tsave()}});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,dialog'))return;const n=+e.key;if(n>=1&&n<=PG.length)location.hash=PG[n-1][0]});
$('#dlg').onclick=e=>{if(e.target.id==='dlg')e.target.close()};
function show(){const p=PG.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'today';$$('.sec').forEach(s=>s.hidden=s.id!==p);$$('#nav a').forEach(a=>{const on=a.dataset.p===p;a.classList.toggle('on',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});if(p==='progress')drawProg();scrollTo(0,0)}

/* Build the UI */
const sh=(id,n)=>`<div id="f-${id}"></div><div id="h-${id}"></div><h4>${n}</h4>${COLS[id].search?`<input id="q-${id}" placeholder="Search entries" aria-label="Search entries" style="margin-bottom:8px">`:''}<div id="l-${id}"></div>`;
const S=(id,h,b)=>`<section class="sec" id="${id}" hidden><h2>${h}</h2>${b}</section>`;
$('#nav').innerHTML='<div class="brand">ZAYO <span>LN</span></div>'+PG.map(([id,n,d])=>`<a href="#${id}" data-p="${id}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>${n}</a>`).join('');
$('#app').innerHTML=
S('today','Today <span class="mu" id="dt" style="font-size:15px;font-weight:400"></span>',`<div id="nudge" class="note" hidden></div>
<div class="panel"><small>Today's execution</small><div class="row bw" style="align-items:end"><div class="big" id="score">0%</div><small id="hint"></small></div><div class="bar"><i id="bar"></i></div></div>
<div class="stats" id="st"></div>
<div class="panel"><h3>Next up</h3><div id="next"></div><div class="row" style="margin-top:10px"><a class="btn pri" href="#focus">Start focus</a><a class="btn" href="#train">Log training</a></div></div>
<div class="panel"><h3>Standards <span class="mu" id="hc"></span></h3><div id="habits"></div></div>
<details class="panel"><summary>Glow-up <span class="mu" id="gp"></span></summary><h4>Morning</h4><div id="gm"></div><h4>Evening</h4><div id="ge"></div><h4>This week</h4><div id="gw"></div></details>
<div class="panel"><h3>End-of-day review</h3><div class="g"><label class="f">What went well<textarea data-rv="win"></textarea></label><label class="f">What to improve<textarea data-rv="improve"></textarea></label><label class="f">Energy and notes<textarea data-rv="energy"></textarea></label></div></div>
<div class="panel"><h3>This week</h3><div class="g"><label class="f">Focus<textarea data-wk="focus"></textarea></label><label class="f">The one thing that must happen<input data-wk="must"></label></div></div>
<div class="panel"><h3>Last 7 days</h3><div class="wb"></div></div>`)+
S('train','Train',sh('rugby','Sessions')+sh('bench','Benchmarks')+sh('life','Fuel and life logs'))+
S('learn','Learn',sh('task','Tasks')+sh('assess','Assessments')+'<h4>Semester units</h4><div id="units"></div><h4>Skill paths</h4><div id="sk"></div>')+
S('focus','Focus',`<div class="panel"><div class="pre">${[25,45,50,90].map(m=>`<button data-a="tpre" data-i="${m}" data-m="${m}">${m}</button>`).join('')}</div><div class="td" id="td" role="timer">25:00</div><div class="row" style="justify-content:center"><button class="pri" id="tb" data-a="tgo">Start</button><button data-a="treset">Reset</button></div><label class="f" style="max-width:300px;margin:12px auto 0">Label<input id="tl" placeholder="e.g. Database unit"></label></div><h4>Recent blocks</h4><div id="l-focus"></div>`)+
S('build','Build',sh('money','Entries')+sh('proj','Projects')+sh('creative','Creative portfolio'))+
S('discover','Discover','<div class="row" style="margin-bottom:12px">'+[['all','All'],['ke','Kenyan'],['us','US'],['rg','Rugby'],['saved','Favourites']].map(([k,n])=>`<button data-a="topic" data-i="${k}"${k==='all'?' class="on"':''}>${n}</button>`).join('')+'</div><div id="dc"></div>'+sh('media','Your picks'))+
S('journal','Journal',sh('journal','Entries'))+
S('progress','Progress','<div class="stats" id="pst"></div><div class="panel"><h3>Last 28 days</h3><div class="hm" id="hm"></div></div><div class="panel"><h3>Last 7 days</h3><div class="wb"></div></div><div class="panel"><h3>Breakdown</h3><div id="bk"></div></div><div class="panel"><h3>Backup</h3><p class="mu">Everything is stored on this device only. Export regularly.</p><div class="row" style="margin:10px 0"><button class="pri" data-a="exp">Export JSON</button><label class="btn" style="color:var(--tx)">Import<input id="imp" class="vh" type="file" accept=".json,application/json"></label></div><small id="ex"></small></div>');
Object.keys(COLS).forEach(id=>{renderForm(id);renderCol(id)});
units();skills();disc();drawToday();$('#tl').value=T.label||'';tdraw();refresh();show();
addEventListener('hashchange',show);document.addEventListener('visibilitychange',tdraw);
let cur=dk();setInterval(()=>{if(T.end)tdraw();if(dk()!==cur){cur=dk();drawToday();refresh()}},1000);
try{navigator.storage?.persist?.()}catch{}
</script></body></html>
